version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - INGEST_API_KEY=${INGEST_API_KEY:-local-dev-key}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - SQLITE_PATH=/app/data/bi_dashboard.db
    volumes:
      - bi_data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  bi_data:
