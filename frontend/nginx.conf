server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only used when frontend + backend are deployed behind the same host
    # (e.g. a single Docker Compose stack). On split deployments (Vercel +
    # Render), the frontend instead calls the backend's public URL directly
    # via VITE_API_BASE_URL at build time.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
